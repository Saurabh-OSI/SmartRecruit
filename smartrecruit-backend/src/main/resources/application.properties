spring.application.name=smartrecruit

server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smartrecruit}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:change-this-local-jwt-secret-before-production-change-this-local-jwt-secret}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
